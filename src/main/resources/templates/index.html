<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexa Bank | Welcome</title>
<link rel="stylesheet" th:href="@{/css/bank.css}" href="../static/css/bank.css">
</head>
<div class="Home_heading">
  <h1>Nexa Bank</h1>
  <br>
  <h2>Login Or Sign Up!</h2>
</div>
<body>
<div class="input_form">
<form action="/username" method="post" class="form-grid">
<input id="username" type="text" name="username" autocomplete="username" placeholder="      Username" required>
<input id="password" type="password" name="password" autocomplete="current-password" placeholder="      Password" required>
<input id="currency" type="text" name="currency" placeholder="      Currency" required>
<div class="isNew">
  <input type="checkbox" name="isNew"><a>New here?</a>
</div>
<button class="btn" type="submit">Continue securely →</button>
</form></div>
<script th:src="@{/js/bank.js}    " src="../static/js/bank.js"></script>
</body>
</html>
