<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexa Bank | Welcome</title>
<link rel="stylesheet" href="static/bank.css">
</head>
<div class="Home_heading">
  <h1>Helloworld</h1>
</div>
<body>
<div class="input_form">
<form action="/username" method="post" class="form-grid">
<input id="username" type="text" name="username" autocomplete="username" placeholder="Username" required>
<br>
<input id="password" type="password" name="password" autocomplete="current-password" placeholder="Password" required>
<br>
<input id="currency" type="text" name="currency" placeholder="e.g. INR" required>
<br>
<input type="checkbox" name="isNew"> I am a new customer
<br>
<button class="btn" type="submit">Continue securely →</button>
</form></div>
<script src="static/bank.js"></script>
</body>
</html>
